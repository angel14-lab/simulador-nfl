<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulador NFL</title>
  <meta name="description" content="Picks de la NFL calculados con datos reales, la línea del mercado y 100 000 simulaciones por partido.">
  <link rel="icon" href="icono.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icono.svg">
  <meta name="theme-color" content="#11161d">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="estilos.css?v=20261124c">
</head>
<body>
  <header class="barra">
    <div class="ancho barra-dentro">
      <a class="logo" href="./"><img src="icono.svg" alt="" width="28" height="28"><span>Simulador NFL</span></a>
      <nav class="nav" aria-label="Secciones">
        <button data-vista="jornada" aria-current="page">Partidos</button>
        <button data-vista="picks">Mejores picks</button>
        <button data-vista="aciertos">Aciertos</button>
        <button data-vista="equipos">Equipos</button>
        <button data-vista="metodo">Método</button>
      </nav>
    </div>
  </header>

  <main id="vista" class="ancho"><p class="vacio">Cargando partidos…</p></main>

  <dialog id="dialogo" aria-labelledby="dialogo-titulo">
    <div class="d-barra"><h2 id="dialogo-titulo">Partido</h2><button id="cerrar" aria-label="Cerrar">Cerrar</button></div>
    <div id="dialogo-cuerpo"></div>
  </dialog>
  <div id="globo" class="globo" hidden></div>

  <footer class="pie ancho">
    <p id="estado-datos">Cargando…</p>
    <p>Probabilidades estimadas, no garantías. Si apuestas, hazlo con moderación.</p>
  </footer>

  <noscript><p style="padding:24px">Esta página necesita JavaScript.</p></noscript>
  <script src="modelo.js?v=20261124c"></script>
  <script src="picks.js?v=20261124c"></script>
  <script src="app.js?v=20261124c"></script>
</body>
</html>
