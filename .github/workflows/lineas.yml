name: Líneas de casas de apuestas

# Baja las líneas y cuotas reales (ganador, hándicaps y totales alternativos, yardas de jugadores)
# con The Odds API: los del partido en las 4 horas previas, los de jugadores en las 24 horas previas
# (ya publicado el parte final de lesiones). Corre cada 20 minutos pero solo gasta créditos cuando a
# un partido le toca una de esas dos bajadas. Necesita el secreto ODDS_API_KEY.
on:
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lineas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Bajar líneas y rehacer los picks vigentes
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          node herramientas/actualizar-datos.js
          node herramientas/actualizar-lineas.js
          node herramientas/registrar-picks.js
      - name: Guardar si hubo cambios
        run: |
          git add datos
          if git diff --cached --quiet; then
            echo "Sin líneas nuevas."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Líneas de casas de apuestas: actualización automática"
          git pull --rebase origin main
          git push
