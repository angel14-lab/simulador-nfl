name: Líneas de casas de apuestas

# Baja las líneas y cuotas reales (ganador, hándicaps y totales alternativos, yardas de jugadores)
# con The Odds API el mismo día de cada partido, una sola vez por partido, para no pasar del cupo
# gratuito. Dos horarios por si GitHub retrasa uno. Necesita el secreto ODDS_API_KEY.
on:
  schedule:
    - cron: '7 13 * * *'
    - cron: '7 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lineas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Bajar líneas y rehacer los picks vigentes
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          node herramientas/actualizar-lineas.js
          node herramientas/registrar-picks.js
      - name: Guardar si hubo cambios
        run: |
          git add datos
          if git diff --cached --quiet; then
            echo "Sin líneas nuevas."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Líneas de casas de apuestas: actualización automática"
          git pull --rebase origin main
          git push
